const VEHICLE_MAKES = {
  NISSAN: ["GTR","GT-R","R31","R32","R33","R34","R35","SKYLINE","SILVIA","S13","S14","S15","180SX","200SX","240SX","350Z","370Z","300ZX","Z32","Z33","Z34","400Z","FAIRLADY","PATROL","GQ","GU","Y60","Y61","Y62","NAVARA","D22","D40","NP300","STAGEA","LAUREL","CEFIRO","A31","C33","C34","C35","PULSAR","GTIR","SUNNY","BLUEBIRD","MAXIMA","X-TRAIL","XTRAIL","PATHFINDER","NISMO","RB20","RB25","RB26","RB30","SR20","VR38","VG30","TD42","ZD30"],
  MITSUBISHI: ["EVO","EVOLUTION","LANCER","GALANT","VR4","VR-4","PAJERO","TRITON","3000GT","GTO","FTO","MIRAGE","ASX","OUTLANDER","DELICA","SIGMA","MAGNA","4G63","4B11","6G72"],
  TOYOTA: ["SUPRA","JZA80","A80","A90","MK4","MK5","CHASER","CRESTA","MARK II","MARK2","MARKII","JZX81","JZX90","JZX100","JZX110","SOARER","ARISTO","ALTEZZA","CELICA","AE86","A86","86","GT86","GR86","GR YARIS","GRYARIS","YARIS","GR COROLLA","COROLLA","HILUX","LANDCRUISER","LAND CRUISER","LC70","LC76","LC79","LC100","LC200","LC300","PRADO","FJ","FJ CRUISER","CAMRY","AURION","MR2","SW20","STARLET","CROWN","CENTURY","HIACE","1JZ","2JZ","3SGTE","4AGE"],
  SUBARU: ["WRX","STI","IMPREZA","GC8","GDA","GDB","GRB","VAB","LIBERTY","LEGACY","FORESTER","BRZ","LEVORG","OUTBACK","EJ20","EJ25","FA20"],
  HONDA: ["CIVIC","INTEGRA","DC2","DC5","EK9","EG","EP3","FD2","FK8","FL5","S2000","NSX","PRELUDE","ACCORD","JAZZ","K20","K24","B16","B18"],
  MAZDA: ["RX7","RX-7","RX8","RX-8","FD","FC","FD3S","FC3S","MX5","MX-5","MIATA","MAZDA3","MAZDA6","MPS","BT50","BT-50","13B","20B"],
  HOLDEN: ["COMMODORE","VL","VK","VN","VP","VR","VS","VT","VX","VY","VZ","VE","VF","MONARO","TORANA","KINGSWOOD","HSV","MALOO","COLORADO","RODEO"],
  FORD: ["FALCON","XR6","XR8","FPV","FG","BF","TERRITORY","RANGER","MUSTANG","FOCUS","FIESTA","RAPTOR","BARRA","EVEREST"],
  VOLKSWAGEN: ["GOLF","GTI","POLO","AMAROK","PASSAT","SCIROCCO","TIGUAN"],
  BMW: ["M2","M3","M4","M5","E30","E36","E46","E92","F80","F82","G80"],
  AUDI: ["RS3","RS4","RS6","S3","S4","TTRS"],
  ISUZU: ["DMAX","D-MAX","MUX","MU-X"],
  SUZUKI: ["SWIFT","JIMNY"],
  LEXUS: ["IS200","IS250","IS300","IS350","GS300","LS400","SC300","SC400"],
  HYUNDAI: ["I30N","I20N","VELOSTER"],
  CHEVROLET: ["CAMARO","CORVETTE","SILVERADO"]
};
const MAKE_NAMES = Object.keys(VEHICLE_MAKES).concat(["TOYOTA","NISSAN","MERCEDES","PORSCHE","DODGE","RAM","JEEP","KIA","ALFA","LAND ROVER","RANGE ROVER","VOLVO","PEUGEOT","RENAULT","DAIHATSU"]);
const MAKE_ALIAS = {VW:"VOLKSWAGEN", CHEVY:"CHEVROLET", MITSI:"MITSUBISHI", MITSU:"MITSUBISHI", DATSUN:"NISSAN", MERC:"MERCEDES"};
const MODEL_TO_MAKE = (() => { const m = {}; for (const [mk, list] of Object.entries(VEHICLE_MAKES)) list.forEach(x => { m[x.replace(/[\s-]/g,"")] = mk; }); return m; })();
function withMake(label){
  const v = norm(label).toUpperCase().replace(/\s+/g, " ");
  if (!v) return v;
  const words = v.split(" ");
  if (MAKE_ALIAS[words[0]]) return [MAKE_ALIAS[words[0]]].concat(words.slice(1)).join(" ");
  if (MAKE_NAMES.includes(words[0]) || MAKE_NAMES.includes(words.slice(0,2).join(" "))) return v;
  for (let n = Math.min(words.length, 3); n >= 1; n--){
    for (let i = 0; i + n <= words.length; i++){
      const mk = MODEL_TO_MAKE[words.slice(i, i+n).join("").replace(/-/g,"")];
      if (mk) return mk + " " + v;
    }
  }
  return v;
}
function vehicleHint(){
  const inp = $("#dVehicle"), h = $("#vehHint"); if (!inp || !h) return;
  const v = norm(inp.value), full = withMake(v);
  h.innerHTML = v && full !== v.toUpperCase().replace(/\s+/g," ") ? `Will save as <b>${esc(full)}</b>` : "";
}
function vehChips(vehicles, current){
  return vehicles.map(v => `<button type="button" class="vchip ${v.label.toUpperCase() === withMake(current) ? "on" : ""}" data-veh="${esc(v.label)}">${esc(v.label)}</button>`).join("");
}
function vehOptions(vehicles){ return vehicles.map(v=>`<option value="${esc(v.label)}">`).join(""); }
function custHintHTML(name){
  const c = customerByName(name);
  return norm(name) && !c ? `New customer — <b>${esc(norm(name))}</b> will be added when you save.` : c && c.phone ? `☎ <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : "";
}
function refreshCustomerBits(){
  const name = $("#dCustomer")?.value || "";
  const c = customerByName(name), vehicles = c ? c.vehicles || [] : [];
  const h = $("#custHint"); if (h) h.innerHTML = custHintHTML(name);
  const vc = $("#vehChips"); if (vc) vc.innerHTML = vehChips(vehicles, $("#dVehicle")?.value || "");
  const vl = $("#vehList"); if (vl) vl.innerHTML = vehOptions(vehicles);
}
function readForm(){
  const e = state.editing; if (!e || !$("#dForm")) return;
  const d = e.draft;
  d.customer = $("#dCustomer").value; d.vehicle = $("#dVehicle").value; d.priority = $("#dPriority").value;
  d.etaDate = $("#dEta").value; d.tracking = $("#dTracking").value; d.comments = $("#dComments").value;
  d.invoiced = $("#dInvoiced").checked; d.paid = $("#dPaid").checked;
  document.querySelectorAll("#dLines .lrow[data-line]").forEach(row => {
    const l = d.lines[+row.dataset.line]; if (!l) return;
    row.querySelectorAll("[data-lf]").forEach(inp => {
      const k = inp.dataset.lf;
      l[k] = k === "qty" ? Math.max(1, Number(inp.value) || 1) : inp.value;
    });
    const known = findSupplier(l.supplier); if (known) l.supplier = known;
  });
}
function parseLines(text, sup){
  return String(text || "").split(/\r?\n/).map(s => s.trim().replace(/^[-•*]\s*/, "")).filter(Boolean).map(s => {
    let status = "pending", qty = 1;
    if (s.includes("✅")) { status = "ordered"; s = s.replace(/\s*✅\s*/g, " ").trim(); }
    let m = /^(\d{1,3})\s*[xX×]\s+(.+)$/.exec(s);
    if (m){ qty = +m[1]; s = m[2]; }
    else if ((m = /^(.+?)\s*[xX×]\s*(\d{1,3})$/.exec(s))){ qty = +m[2]; s = m[1]; }
    let pn = (/\b([A-Z]{1,6}[0-9][A-Z0-9-]*[A-Z0-9])\b/.exec(s) || [])[1] || "";
    if (pn && (pn.length < 6 || /^(RB|EJ|SR|VG|VR|JZ|KA|CA|FA|FB|EZ)[0-9]{2}[A-Z]*$/.test(pn))) pn = "";
    let supplier = sup || "";
    if (!supplier){
      const low = " " + s.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " ";
      const hit = knownSuppliers().sort((a,b) => b.length - a.length).find(n => { const k = " " + n.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " "; return k.trim() && low.includes(k); });
      if (hit) supplier = hit;
    }
    return {id:"", qty, part_no: pn, description: s, supplier, status};
  });
}
function draftPayload(){
  const e = state.editing, d = e.draft;
  const lines = d.lines
    .map(l => ({...l, part_no: norm(l.part_no), description: norm(l.description), supplier: norm(l.supplier).toUpperCase(), qty: Math.max(1, Number(l.qty) || 1)}))
    .filter(l => l.part_no || l.description);
  const p = {
    status: d.status, type: d.type || "customer", priority: d.priority,
    customer_name: norm(d.customer).toUpperCase(), vehicle_label: withMake(d.vehicle),
    eta_date: d.etaDate || "", tracking: norm(d.tracking), comments: d.comments.replace(/\s+$/,""),
    invoiced: !!d.invoiced, paid: !!d.paid,
    lines: lines.map(({id, qty, part_no, description, supplier, status}) => ({id, qty, part_no, description, supplier, status}))
  };
  if (e.id) p.id = e.id;
  return p;
}
async function saveDraft(){
  readForm();
  const p = draftPayload();
  if (!p.customer_name && !p.lines.length && !norm(state.editing.draft.parts)) throw {code:"validation", message:"Add a customer or at least one part before saving."};
  const unknown = p.lines.map(l => l.supplier).filter(s => s && !findSupplier(s));
  if (unknown.length) await addSuppliers(unknown);
  const id = await rpc("parts_app_save", {p});
  if (id) state.editing.id = id;
  return {id, p};
}
async function saveDrawer(){
  const btn = $("#dSave"); const isNew = !state.editing.id;
  btn.disabled = true; btn.textContent = "Saving…";
  pending++;
  try {
    const {p} = await saveDraft();
    const before = !isNew ? state.orders.find(x => x.id === state.editing.id) : null;
    const groups = p.type !== "list" ? statusGroups(p.lines).length : 1;
    toast(groups > 1 ? `Saved as ${groups} orders — one for each part status` : p.status === "Received" && (!before || before.status !== "Received") ? "Saved — received orders move to the archive after a day" : (isNew ? "Order added" : "Order saved"));
    closeDrawer();
  } catch(err){
    btn.disabled = false; btn.textContent = isNew ? "Add order" : "Save changes";
    toast(err && err.code === "validation" ? err.message : errText(err));
  } finally { pending--; load(); }
}
async function splitFromDrawer(){
  const e = state.editing;
  if (!e.splitArmed){ readForm(); e.splitArmed = true; drawDrawer(); return; }
  const btn = $("#splitBtn"); btn.disabled = true; btn.textContent = "Splitting…";
  pending++;
  try {
    const {id} = await saveDraft();
    const n = await rpc("parts_app_split", {p_order: id}) || 0;
    toast(n ? `Split into ${plural(n, "supplier order")}` : "Nothing to split — pick a supplier for each part first");
    closeDrawer();
  } catch(err){ e.splitArmed = false; drawDrawer(); toast(err && err.code === "validation" ? err.message : errText(err)); }
  finally { pending--; load(); }
}
async function deleteFromDrawer(){
  const e = state.editing;
  if (!e.armed){ readForm(); e.armed = true; drawDrawer(); clearTimeout(e.t); e.t = setTimeout(() => { if (state.editing === e){ readForm(); e.armed = false; drawDrawer(); } }, 4000); return; }
  const id = e.id;
  pending++;
  try { await rpc("parts_app_delete_order", {p_order: id}); state.orders = state.orders.filter(o => o.id !== id); closeDrawer(); render(); toast("Order deleted"); }
  catch(err){ toast(errText(err)); }
  finally { pending--; load(); }
}

/* ---------- side panels: suppliers & customers ---------- */
function openPanel(kind){
  state.editing = null; state.panel = kind; state.panelFilter = ""; state.merge = null; state.custEdit = null;
  const sup = kind === "sup";
  $("#drawerRoot").innerHTML = `
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="dr-h"><h2 id="pTitle">${sup ? "Suppliers" : "Customers"}</h2><button class="x" type="button" data-close aria-label="Close">×</button></div>
    <div class="dr-b">
      <div class="field"><label for="pAddIn">${sup ? "Add a supplier" : "Add a customer"}</label>
        <div class="addrow"><input id="pAddIn" type="text" placeholder="${sup ? "Supplier name" : "Customer name"}" autocomplete="off"><button type="button" class="btn primary" id="pAddBtn">Add</button></div>
      </div>
      <div class="field"><label for="pFilter">${sup ? "Your suppliers" : "Your customers"}</label>
        <input id="pFilter" type="text" placeholder="Filter the list…" autocomplete="off">
      </div>
      <p class="hint" style="margin:0">${sup ? "Removing a supplier only takes it off the pick list. Orders that already use it keep it." : "Customers are added automatically when you save an order. Merge duplicates so each customer’s history is in one place."}</p>
      <div class="suprows" id="pRows"></div>
    </div>
  </aside>`;
  drawPanelRows();
  setTimeout(() => $("#pAddIn")?.focus(), 30);
}
function drawPanelRows(){
  const el = $("#pRows"); if (!el) return;
  const f = state.panelFilter.toLowerCase();
  if (state.panel === "sup"){
    const uses = {}; state.orders.forEach(o => orderSuppliers(o).forEach(s => uses[s] = (uses[s]||0) + 1));
    const rows = supplierList().filter(s => !f || s.toLowerCase().includes(f));
    el.innerHTML = rows.length ? rows.map(s => `<div class="suprow"><span><span class="sup">${esc(s)}</span>${uses[s] ? `<span class="uses">${plural(uses[s],"order")}</span>` : ""}</span><button type="button" class="btn sm danger" data-rmsup="${esc(s)}">Remove</button></div>`).join("")
      : `<div class="suprow"><span class="muted">No suppliers match.</span></div>`;
    return;
  }
  const stats = {}; state.orders.forEach(o => { if (!o.customerId) return; const s = stats[o.customerId] || (stats[o.customerId] = {n:0, open:0}); s.n++; if (o.status !== "Received") s.open++; });
  const rows = state.customers.filter(c => !f || c.name.toLowerCase().includes(f) || (c.vehicles||[]).some(v => v.label.toLowerCase().includes(f)));
  el.innerHTML = rows.length ? rows.map(c => {
    const s = stats[c.id] || {n:0, open:0};
    if (state.custEdit === c.id) return `<div class="suprow cedit">
      <div class="cfields">
        <input type="text" id="ceName" value="${esc(c.name)}" aria-label="Name">
        <input type="text" id="cePhone" value="${esc(c.phone)}" placeholder="Phone" aria-label="Phone">
        <div class="addrow"><input type="text" id="ceVeh" placeholder="Add a vehicle, e.g. R34 GTR" aria-label="New vehicle"><button type="button" class="btn sm" data-addveh="${esc(c.id)}">Add vehicle</button></div>
      </div>
      <div class="cbtns"><button type="button" class="btn sm primary" data-cesave="${esc(c.id)}">Save</button><button type="button" class="btn sm ghost" data-ceclose>Cancel</button></div>
    </div>`;
    if (state.merge === c.id) return `<div class="suprow cedit">
      <div class="cfields"><span>Merge <b>${esc(c.name)}</b> into:</span>
        <select id="mergeInto" aria-label="Merge into">${state.customers.filter(x => x.id !== c.id).map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select>
        <span class="muted">All ${plural(s.n,"order")} and vehicles move across, then ${esc(c.name)} is removed.</span></div>
      <div class="cbtns"><button type="button" class="btn sm primary" data-domerge="${esc(c.id)}">Merge</button><button type="button" class="btn sm ghost" data-ceclose>Cancel</button></div>
    </div>`;
    return `<div class="suprow">
      <span class="cinfo"><b>${esc(c.name)}</b>${c.phone ? ` <span class="muted">· ${esc(c.phone)}</span>` : ""}
        <span class="vlist">${(c.vehicles||[]).map(v => `<span class="sup">${esc(v.label)}</span>`).join(" ")}</span>
        <span class="uses">${plural(s.n,"order")}${s.open ? ` · ${s.open} open` : ""}</span></span>
      <span class="cbtns"><button type="button" class="btn sm" data-custview="${esc(c.id)}">Orders</button><button type="button" class="btn sm ghost" data-custedit="${esc(c.id)}">Edit</button><button type="button" class="btn sm ghost" data-merge="${esc(c.id)}">Merge</button></span>
    </div>`;
  }).join("") : `<div class="suprow"><span class="muted">No customers match.</span></div>`;
}
async function panelAdd(){
  const inp = $("#pAddIn"); const v = norm(inp.value).toUpperCase(); if (!v) return;
  if (state.panel === "sup"){
    if (supplierList().some(s => s.toLowerCase() === v.toLowerCase())) { toast(`${v} is already on the list`); return; }
    if (await addSuppliers([v])){ inp.value = ""; inp.focus(); }
  } else {
    if (customerByName(v)) { toast(`${v} is already a customer`); return; }
    const r = await run("parts_app_customer_add", {p_name: v}, `Added ${v}`);
    if (r){ inp.value = ""; inp.focus(); }
  }
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target;
  if (t.closest("[data-stop]")) return;
  const q = sel => t.closest(sel);
  let el;
  if ((el = q("[data-type]"))){ state.type = el.dataset.type; render(); return; }
  if (q("#supBtn")){ openPanel("sup"); return; }
  if (q("#custBtn")){ openPanel("cust"); return; }
  if (q("#pAddBtn")){ panelAdd(); return; }
  if ((el = q("[data-rmsup]"))){ removeSupplier(el.dataset.rmsup); return; }
  if ((el = q("[data-custview]"))){ state.customerId = el.dataset.custview; state.status = null; state.flag = null; if (state.view === "archive") state.view = store("view") || "board"; closeDrawer(); render(); return; }
  if ((el = q("[data-custedit]"))){ state.custEdit = el.dataset.custedit; state.merge = null; drawPanelRows(); $("#ceName")?.focus(); return; }
  if ((el = q("[data-merge]"))){ state.merge = el.dataset.merge; state.custEdit = null; drawPanelRows(); return; }
  if (q("[data-ceclose]")){ state.merge = null; state.custEdit = null; drawPanelRows(); return; }
  if ((el = q("[data-cesave]"))){ const id = el.dataset.cesave; state.custEdit = null; run("parts_app_customer_update", {p: {id, name: $("#ceName").value.toUpperCase(), phone: $("#cePhone").value}}, "Customer saved"); drawPanelRows(); return; }
  if ((el = q("[data-addveh]"))){ const v = norm($("#ceVeh").value); if (v) run("parts_app_vehicle_add", {p_customer: el.dataset.addveh, p_label: v.toUpperCase()}, `Added ${v.toUpperCase()}`); $("#ceVeh").value = ""; return; }
  if ((el = q("[data-domerge]"))){ const from = el.dataset.domerge, into = $("#mergeInto").value; if (!into) return; state.merge = null; if (state.customerId === from) state.customerId = into; run("parts_app_customer_merge", {p_from: from, p_into: into}, "Customers merged"); drawPanelRows(); return; }
  if (q("#custChip")){ state.customerId = ""; render(); return; }

  if ((el = q("[data-status]"))){ state.status = state.status === el.dataset.status ? null : el.dataset.status; state.flag = null; if (state.view === "archive") state.view = store("view") || "board"; render(); return; }
  if ((el = q("[data-flag]"))){ state.flag = state.flag === el.dataset.flag ? null : el.dataset.flag; state.status = null; render(); return; }
  if ((el = q("[data-view]"))){ const v = el.dataset.view; state.view = (v === "archive" && state.view === "archive") ? (store("view") || "board") : v; if (state.view !== "archive") store("view", state.view); if (state.view === "archive") state.status = null; render(); return; }
  if ((el = q("[data-sort]"))){ const k = el.dataset.sort; state.sort = {key:k, dir: state.sort.key===k ? -state.sort.dir : 1}; render(); return; }
  if ((el = q("[data-advance]"))){ patch(el.dataset.advance, {status: el.dataset.to}, `Moved to ${el.dataset.to}`); return; }
  if ((el = q("[data-open]"))){ openDrawer(el.dataset.open); return; }
  if ((el = q("[data-toggle]"))){ const o = state.orders.find(x => x.id === el.dataset.id); if (o) patch(o.id, {[el.dataset.toggle]: !o[el.dataset.toggle]}); return; }
  if ((el = q("[data-copy]"))){ copyRun(el.dataset.copy); return; }
  if ((el = q("[data-orderall]"))){ orderAll(el.dataset.orderall, el); return; }
  if (q("#clearBtn")){ state.q=""; state.priority=""; state.supplier=""; state.status=null; state.flag=null; state.type=""; state.customerId=""; $("#q").value=""; render(); return; }
  if (q("#newBtn")){ openDrawer(null); return; }
  if (q("#retryBtn")){ state.error = null; $("#main").innerHTML = `<div class="state"><strong>Connecting…</strong></div>`; load(); return; }

  if (q("#syncBtn")){ load(); return; }

  // order drawer
  if (q("[data-close]")){ closeDrawer(); return; }
  const e = state.editing;
  if (e){
    if ((el = q("[data-set-status]"))){ readForm(); const s = el.dataset.setStatus; if (s !== e.draft.status){ e.draft.status = s; e.draft.lines = cascadeLines(e.draft.lines, s); } drawDrawer(); return; }
    if ((el = q("[data-set-type]"))){ readForm(); e.draft.type = el.dataset.setType; drawDrawer(); return; }
    if ((el = q("[data-veh]"))){ $("#dVehicle").value = el.dataset.veh; refreshCustomerBits(); return; }
    if ((el = q("[data-eta]"))){ readForm(); const d = new Date(); d.setDate(d.getDate() + Number(el.dataset.eta)); e.draft.etaDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; drawDrawer(); return; }
    if ((el = q("[data-lstat]"))){ readForm(); const l = e.draft.lines[+el.dataset.lstat]; l.status = LSTAT[(LSTAT.indexOf(l.status) + 1) % 3]; drawDrawer(); return; }
    if ((el = q("[data-allstat]"))){ readForm(); e.draft.lines.forEach(l => l.status = el.dataset.allstat); drawDrawer(); return; }
    if ((el = q("[data-lrm]"))){ readForm(); e.draft.lines.splice(+el.dataset.lrm, 1); drawDrawer(); return; }
    if (q("#addLine")){ readForm(); const last = e.draft.lines[e.draft.lines.length-1]; e.draft.lines.push(newLine(last ? last.supplier : "")); drawDrawer(); document.querySelector(`#ld${e.draft.lines.length-1}`)?.focus(); return; }
    if (q("#togglePaste")){ readForm(); e.paste = !e.paste; drawDrawer(); $("#pasteIn")?.focus(); return; }
    if (q("#pasteAdd")){ const txt = $("#pasteIn").value; readForm(); const add = parseLines(txt); e.draft.lines = e.draft.lines.filter(l => norm(l.description) || norm(l.part_no)).concat(add); e.paste = false; drawDrawer(); toast(`Added ${plural(add.length, "part")}`); return; }
    if (q("#convertNotes")){ readForm(); const add = parseLines(e.draft.parts, (e.draft.supplier||[]).length === 1 ? e.draft.supplier[0] : ""); e.draft.lines = add; drawDrawer(); toast(`Made ${plural(add.length, "part line")} — check them, then save`); return; }
    if (q("#bulkSupBtn")){ const v = norm($("#bulkSup").value).toUpperCase(); readForm(); if (v){ const s = findSupplier(v) || v; e.draft.lines.forEach(l => { if (!norm(l.supplier)) l.supplier = s; }); } drawDrawer(); return; }
    if (q("#splitBtn")){ splitFromDrawer(); return; }
    if (q("#dSave")){ saveDrawer(); return; }
    if (q("#dDelete")){ deleteFromDrawer(); return; }
    if (q(".drawer")) return;
  }
  const card = q("[data-id]");
  if (card && !q("button,select,a,input")) openDrawer(card.dataset.id);
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.matches("[data-status-for]")) patch(t.dataset.statusFor, {status: t.value}, `Moved to ${t.value}`);
  if (t.id === "fPriority"){ state.priority = t.value; render(); }
  if (t.id === "fSupplier"){ state.supplier = t.value; render(); }
  if (state.editing && t.id === "dVehicle"){ t.value = withMake(t.value); vehicleHint(); }
  if (state.editing && (t.id === "dCustomer" || t.id === "dVehicle")) refreshCustomerBits();
});
let qT;
const CAPS = "#dCustomer, #dVehicle, .lsup, #bulkSup, #pAddIn, #ceName, #ceVeh";
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.matches && t.matches(CAPS) && t.value !== t.value.toUpperCase()){
    const a = t.selectionStart, b = t.selectionEnd;
    t.value = t.value.toUpperCase();
    try { t.setSelectionRange(a, b); } catch(_){}
  }
  if (t.id === "q"){ clearTimeout(qT); qT = setTimeout(() => { state.q = t.value.trim(); render(); }, 120); }
  if (t.id === "pFilter"){ state.panelFilter = t.value.trim(); drawPanelRows(); }
  if (state.editing && (t.id === "dCustomer" || t.id === "dVehicle")) refreshCustomerBits();
  if (state.editing && t.id === "dVehicle") vehicleHint();
  if (state.editing && t.matches(".lsup")){ const v = norm(t.value); const isNew = !!v && !findSupplier(v); t.classList.toggle("newsup", isNew); t.title = isNew ? "New supplier — added to your list when you save" : ""; }
});
document.addEventListener("keydown", ev => {
  const t = ev.target;
  if (ev.key === "Escape" && (state.editing || state.panel)){ closeDrawer(); return; }
  if (t.id === "pAddIn" && ev.key === "Enter"){ ev.preventDefault(); panelAdd(); return; }
  if (state.editing && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)){ ev.preventDefault(); saveDrawer(); return; }
  if (state.editing && ev.key === "Enter" && t.matches("#dLines input")){
    ev.preventDefault();
    const row = t.closest(".lrow"); const i = +row.dataset.line;
    readForm();
    if (i === state.editing.draft.lines.length - 1){ state.editing.draft.lines.push(newLine(state.editing.draft.lines[i].supplier)); }
    drawDrawer(); document.querySelector(`#ld${i+1}`)?.focus();
    return;
  }
  if (state.editing && ev.key === "Enter" && t.tagName === "INPUT"){ ev.preventDefault(); return; }
  if (ev.key === "Enter" && t.matches(".card,.run-i")){ openDrawer(t.dataset.id); }
  if (ev.key === "/" && !t.matches("input,textarea,select")){ ev.preventDefault(); $("#q").focus(); }
});

/* drag between board columns */
let dragId = null;
document.addEventListener("dragstart", ev => { const c = ev.target.closest?.(".card"); if (!c) return; dragId = c.dataset.id; c.classList.add("dragging"); ev.dataTransfer.effectAllowed = "move"; try{ ev.dataTransfer.setData("text/plain", dragId); }catch(e){} });
document.addEventListener("dragend", ev => { ev.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over")); dragId = null; });
document.addEventListener("dragover", ev => { const c = ev.target.closest?.(".col"); if (!c || !dragId) return; ev.preventDefault(); document.querySelectorAll(".col.over").forEach(x=>{ if(x!==c) x.classList.remove("over"); }); c.classList.add("over"); });
document.addEventListener("drop", ev => {
  const c = ev.target.closest?.(".col"); if (!c || !dragId) return; ev.preventDefault();
  const o = state.orders.find(x => x.id === dragId); const to = c.dataset.col;
  c.classList.remove("over");
  if (o && o.status !== to) patch(o.id, {status: to}, `Moved to ${to}`);
});

/* supplier run helpers */
function runItems(name){ return openLines(state.orders.filter(o => matches(o))).filter(r => norm(r.l.supplier) === name); }
async function copyRun(name){
  const items = runItems(name);
  const text = `${name} — parts order (JPS Motorsports)\n\n` + items.map(({o,l}) => {
    const who = [norm(o.customer), norm(o.vehicle)].filter(Boolean).join(" · ") || (typeOf(o) === "stock" ? "Stock" : typeOf(o) === "tools" ? "Tools" : "");
    return `${Number(l.qty)||1} x ${[norm(l.part_no), norm(l.description)].filter(Boolean).join(" — ")}${who ? `   [${who}]` : ""}`;
  }).join("\n");
  try { await navigator.clipboard.writeText(text); toast(`Copied ${plural(items.length, "part")} for ${name}`); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){} ta.remove();
    toast(ok ? `Copied ${plural(items.length, "part")} for ${name}` : "Couldn’t copy — open the orders and copy the parts instead.");
  }
}
async function orderAll(name, btn){
  if (btn.dataset.armed !== "1"){ btn.dataset.armed = "1"; btn.textContent = "Confirm"; btn.classList.add("primary"); setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed=""; btn.textContent="Mark all ordered"; btn.classList.remove("primary"); } }, 4000); return; }
  const items = runItems(name);
  if (!items.length) return;
  const ids = items.map(r => r.l.id);
  items.forEach(({l}) => { l.status = "ordered"; });
  render();
  await run("parts_app_lines_status", {p_ids: ids, p_status: "ordered"}, `${plural(items.length, "part")} from ${name} marked ordered`);
}

/* ---------- boot ---------- */
render();
(async () => {
  if (!sb){ state.error = "Couldn’t load the database library. Check your internet connection and reload."; render(); syncLabel(); return; }
  mcp = sb;
  $("#main").innerHTML = `<div class="state"><strong>Loading orders…</strong></div>`;
  await load();
  schedule();
})();
})();
</script>
